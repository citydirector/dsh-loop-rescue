# dsh-loop-rescue 的 bundle 补丁：默认配置即可挂载。
# 与 @mrweicodes/dsh-loop-guard 二选一：两者都包装 llm/stream，同时开会重复切断。
#
# 按需在 profile 里覆盖，例如：
#
#   - set:
#       - id: loop-rescue
#         config:
#           mode: rescue            # rescue | cut | observe
#           retryTemperature: 1.0   # 续跑那一次请求换个温度
#           maxConsecutiveRescues: 3

- insert:
    - id: loop-rescue
      name: 'dsh-loop-rescue'
